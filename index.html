<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>나랑 닮은 AI는? | AI 닮은꼴 테스트</title>
  <meta name="description" content="20개 질문으로 알아보는 나와 닮은 AI 모델. Claude, ChatGPT, Gemini, Grok부터 Llama, Qwen, DeepSeek 같은 로컬 모델까지 16가지 유형.">
  <meta name="theme-color" content="#FFF8EC">
  <meta property="og:type" content="website">
  <meta property="og:title" content="나랑 닮은 AI는?">
  <meta property="og:description" content="20개 질문으로 알아보는 나의 AI 닮은꼴. 16가지 유형 중 나는 누구?">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 10C76 9 92 30 90 53C88 78 70 91 48 90C25 89 9 74 11 50C13 27 27 11 50 10Z' fill='%23FFC83D' stroke='%232B2118' stroke-width='6'/%3E%3Ccircle cx='38' cy='48' r='5' fill='%232B2118'/%3E%3Ccircle cx='62' cy='48' r='5' fill='%232B2118'/%3E%3Cpath d='M38 64Q50 74 62 64' fill='none' stroke='%232B2118' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app">

    <!-- 시작 화면 -->
    <section class="screen" id="intro" hidden>
      <div class="intro-top">
        <span class="sticker tilt-l">AI 닮은꼴 테스트</span>
      </div>
      <h1 class="intro-title">나랑 닮은<br><span class="hl">AI</span>는 누구?</h1>
      <p class="intro-sub">말투, 고민 상담 스타일, 마감 전날의 모습까지.<br>20개 질문으로 16가지 AI 중 나의 닮은꼴을 찾아드려요.</p>
      <div class="intro-crowd" id="introCrowd" aria-hidden="true"></div>
      <div class="intro-meta">
        <span class="chip">20문항</span><span class="chip">약 3분</span><span class="chip">16가지 유형</span>
      </div>
      <button class="btn btn-primary btn-big" id="startBtn" type="button">테스트 시작하기</button>
      <button class="link-btn" id="browseBtn" type="button">16가지 유형 먼저 구경하기</button>
      <p class="fine">재미로 보는 성향 테스트예요. 각 AI 회사와는 관련이 없어요.</p>
    </section>

    <!-- 문항 화면 -->
    <section class="screen" id="quiz" hidden>
      <div class="quiz-head">
        <button class="icon-btn" id="backBtn" type="button" aria-label="이전 질문">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5 L8 12 L15 19" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="progress" role="progressbar" aria-valuemin="1" aria-valuemax="20" id="progress">
          <div class="progress-fill" id="progressFill"></div>
          <div class="progress-walker" id="progressWalker" aria-hidden="true"></div>
        </div>
        <span class="progress-num" id="progressNum">1/20</span>
      </div>
      <div class="q-wrap" id="qWrap">
        <p class="q-index" id="qIndex">Q1</p>
        <h2 class="q-text" id="qText"></h2>
        <ol class="answers" id="answers"></ol>
      </div>
    </section>

    <!-- 결과 계산 중 -->
    <section class="screen" id="loading" hidden>
      <div class="loading-box">
        <div class="loading-stack" id="loadingStack" aria-hidden="true"></div>
        <p class="loading-text" id="loadingText" aria-live="polite">답변을 읽는 중…</p>
      </div>
    </section>

    <!-- 결과 화면 -->
    <section class="screen" id="result" hidden></section>

    <!-- 전체 유형 -->
    <section class="screen" id="gallery" hidden>
      <div class="gallery-head">
        <button class="icon-btn" id="galleryBack" type="button" aria-label="뒤로">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5 L8 12 L15 19" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h2>16가지 AI 유형</h2>
      </div>
      <p class="gallery-sub">초록 스티커가 붙은 유형은 내 컴퓨터에서 직접 돌릴 수 있는 <b>로컬(오픈 웨이트) 모델</b>이에요.</p>
      <div class="type-grid" id="typeGrid"></div>
      <button class="btn btn-primary btn-big" id="galleryStart" type="button">나는 누구일까? 테스트하기</button>
    </section>

  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/mascot.js"></script>
  <script src="js/card.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
